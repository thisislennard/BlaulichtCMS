# Separates WordPress-Zielsystem für Integrationstests der BlaulichtCMS Bridge.
# Nicht Teil der produktiven Auslieferung (die bleibt bei einem BlaulichtCMS-Container).
#
#   docker compose -f test/wordpress/compose.yaml up -d
#   → WordPress unter http://localhost:8080, BlaulichtCMS aus WordPress-Sicht: http://host.docker.internal:7310
#
# Images per Digest fixiert; neue Tags/Digests meldet die wöchentliche Versionsprüfung (scripts/check-versions.mjs).

name: blaulichtcms-wp-test

services:
  db:
    image: mariadb:13@sha256:54f493ea0d60b621a5bff84e5b20100f8b86b6efa6b79158e04756c5194a5e4d
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress-test
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 30

  wordpress:
    image: wordpress:7-php8.5-apache@sha256:346b6d0ed10345daba924f3fa540b79c58f4e319e14287b0a3bdb92ccb233b8b
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress-test
      WORDPRESS_DB_NAME: wordpress
      # Nur im Test: Kopplung über http:// erlauben
      WORDPRESS_CONFIG_EXTRA: |
        define( 'BLAULICHTCMS_BRIDGE_ALLOW_HTTP', true );
    volumes:
      - wp:/var/www/html

  cli:
    image: wordpress:cli-php8.5@sha256:1d394f76435b0e513154ede4b741443a93a1e17a6bec5435f94157d33776c1b6
    profiles: ["cli"]
    user: "33:33"
    depends_on: [wordpress]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress-test
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_CONFIG_EXTRA: |
        define( 'BLAULICHTCMS_BRIDGE_ALLOW_HTTP', true );
    volumes:
      - wp:/var/www/html
      - ./tmp:/tmp/blaulichtcms

volumes:
  db:
  wp:
