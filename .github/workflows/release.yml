name: Release

# In-App-Updates (docs/architektur.md, „In-App-Updates“): Bei jedem Tag v* entsteht hier das signierte Update-Paket
# und ein GitHub-Release mit drei Dateien (ZIP, .sha256, .sig). BlaulichtCMS-Server laden es über Einstellungen → Updates
# und prüfen die Signatur gegen den öffentlichen Schlüssel ihrer laufenden Version.
#
# Zwei getrennte Jobs auf getrennten Runnern: „build“ installiert alle Abhängigkeiten, prüft Typen und baut – ohne
# Zugriff auf den Signaturschlüssel. „sign-release“ führt keinen Paketcode aus (kein npm ci), liest den privaten
# Schlüssel aus dem Secret BLAULICHTCMS_UPDATE_SIGNING_KEY in eine 0600-Datei, signiert, prüft und veröffentlicht.
# Die Tests laufen bei jedem Push auf main in ci.yml; ein Tag gehört auf einen Commit mit grüner CI.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  # onnxruntime-node (#214): keine GPU-Bibliotheken von NuGet nachladen (gebraucht wird nur der Typcheck/Build)
  ONNXRUNTIME_NODE_INSTALL: skip

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Versionshinweise und Prüfung auf Image-Änderungen seit dem letzten Tag
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Update-Paket bauen
        run: node scripts/build-release.mjs --tag "$GITHUB_REF_NAME" --out dist-release
      - name: Unsignierte Release-Dateien übergeben
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: dist-release/
          if-no-files-found: error
          retention-days: 1

  sign-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub-Release anlegen und Dateien hochladen
    steps:
      # Nur für scripts/update-signing.mjs, server/src/updates/signing.ts und server/update-signing-key.pub
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Release-Dateien übernehmen
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist-release
      - name: Update-Paket signieren
        env:
          SIGNING_KEY: ${{ secrets.BLAULICHTCMS_UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::Secret BLAULICHTCMS_UPDATE_SIGNING_KEY fehlt – ohne Signatur lehnen die Server das Update ab."
            exit 1
          fi
          zip="dist-release/blaulichtcms-update-${GITHUB_REF_NAME}.zip"
          # Übergabe zwischen den Jobs prüfen (Prüfsumme aus dem build-Job)
          (cd dist-release && sha256sum -c "blaulichtcms-update-${GITHUB_REF_NAME}.zip.sha256")
          umask 077
          key_file="$RUNNER_TEMP/update-signing.pem"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$SIGNING_KEY" > "$key_file"
          # sign prüft die Signatur danach gegen server/update-signing-key.pub
          node scripts/update-signing.mjs sign "$zip" --key "$key_file"
          node scripts/update-signing.mjs verify "$zip"
      - name: GitHub-Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          zip="dist-release/blaulichtcms-update-${GITHUB_REF_NAME}.zip"
          version="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$zip" "$zip.sha256" "$zip.sig" --clobber
            gh release edit "$GITHUB_REF_NAME" --title "BlaulichtCMS $version" --notes-file "$zip.notes.md"
          else
            gh release create "$GITHUB_REF_NAME" "$zip" "$zip.sha256" "$zip.sig" \
              --title "BlaulichtCMS $version" --notes-file "$zip.notes.md" --verify-tag
          fi
          {
            echo "### BlaulichtCMS $version"
            echo '```'
            cat "$zip.sha256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
