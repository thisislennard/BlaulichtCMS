name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: lifelink
          POSTGRES_PASSWORD: lifelink
          POSTGRES_DB: lifelink_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lifelink" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -w server
        env:
          TEST_DATABASE_URL: postgresql://lifelink:lifelink@127.0.0.1:5432/lifelink_test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Image bauen
        run: docker build -t lifelink:ci .
      - name: Probelauf mit Compose
        run: |
          cat > .env <<EOF
          POSTGRES_PASSWORD=ci-passwort-$(openssl rand -hex 8)
          LIFELINK_MASTER_KEY=$(openssl rand -base64 32)
          PUBLIC_URL=http://localhost:7310
          COOKIE_SECURE=false
          TRUST_PROXY=false
          EOF
          docker compose up -d
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:7310/healthz; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:7310/healthz
          curl -fsS http://localhost:7310/api/v1/auth/state
          docker compose exec -T lifelink node server/dist/cli.js self-check
          docker compose logs lifelink | tail -50
      - name: Aufräumen
        if: always()
        run: docker compose down -v
